<!DOCTYPE html>
<html>
<head>
    <title>BLE Door App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <p id="status"></p>
    <div class="topnav">
        <h1>BLE Door Web Application</h1>
        <p style="font-size:0.8em; color:#666;">Version 1.0.0</p>
    </div>

    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton"> Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="disconnectButton"> Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <p>
                    <label for="numInput">Befehl:</label>
                    <input id="numInput" type="text" placeholder="?">
                    <button id="offButton" class="offButton" disabled>Senden</button>
                </p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <p>Last value received: <span id="valueContainer"></span></p>
                <p>Last sent: <span id="valueSent"></span></p>
                <p>Timestamp: <span id="timestamp"></span></p>
            </div>
        </div>
    </div>

<script>
    // Auto-connect to previously paired device if available
    async function autoConnectToDevice() {
        if (!navigator.bluetooth) {
            bleStateContainer.innerHTML = "Web Bluetooth API not available!";
            return;
        }

        try {
            const knownDevices = await navigator.bluetooth.getDevices();
            let device;

            if (knownDevices.length > 0) {
                device = knownDevices.find(d => d.name === deviceName);
                if (device) {
                    bleStateContainer.innerHTML = 'Connecting to known device: ' + device.name;
                    device.addEventListener('gattserverdisconnected', onDisconnected);
                    const server = await device.gatt.connect();
                    await setupDevice(server);
                    return;
                }
            }

            // No known device found, request via popup
            bleStateContainer.innerHTML = 'No known device found. Please select BLE2FORD in the popup';
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: deviceName }],
                optionalServices: [bleService]
            });

            bleStateContainer.innerHTML = 'Connecting to ' + device.name;
            device.addEventListener('gattserverdisconnected', onDisconnected);
            const server = await device.gatt.connect();
            await setupDevice(server);

        } catch (err) {
            console.error("Connection failed:", err);
        }
    }

    async function setupDevice(server) {
        bleServer = server;
        const service = await bleServer.getPrimaryService(bleService);
        bleServiceFound = service;

        const nonSecureChar = await service.getCharacteristic(pNonSecureCharacteristic);
        pNonSecureCharacteristicFound = nonSecureChar;
        nonSecureChar.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
        await nonSecureChar.startNotifications();

        const secureChar = await service.getCharacteristic(pRelaySecureCharacteristicUUID);
        pRelaySecureCharacteristicFound = secureChar;
        console.log("Secure characteristic found:", secureChar.uuid);

        offButton.disabled = false;
        bleStateContainer.innerHTML = 'Connected to ' + bleServer.device.name;
        bleStateContainer.style.color = "#2e7d32"; // green
    }

    // Replace the original connectButton click listener
    connectButton.addEventListener('click', () => { autoConnectToDevice(); });

    // Optionally, you can also call autoConnectToDevice() on page load:
    // window.addEventListener('load', autoConnectToDevice);
</script>

</body>
</html>
