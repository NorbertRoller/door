<!DOCTYPE html>
<html>
<head>
    <title>BLE CAR App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <p id="status"></p>
    <div class="topnav">
        <h1>BLE Web Application <span id="setupIcon">&#9881;</span></h1>
        <p style="font-size:0.8em; color:#666;">Version 1.4.S</p>
    </div>

    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton">Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="disconnectButton">Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <p style="margin-bottom:8px;">
                    <label for="numInput">Cmd:</label>
                    <input id="numInput" type="text" placeholder="?" style="width:20ch; font-family:inherit; font-size:1rem;" maxlength="20">
                </p>
                <p>
                    <button id="offButton" class="offButton">Send command to Device</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Modal for changing password -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>Change Password / Cmd</h3>
            <input id="oldPassword" type="text" placeholder="Old password" maxlength="20">
            <input id="newPassword" type="text" placeholder="New password" maxlength="20">
            <input id="repeatPassword" type="text" placeholder="Repeat new password" maxlength="20">
            <div>
                <button id="sendPasswordButton" disabled>Send</button>
                <button id="cancelPasswordButton">Cancel</button>
            </div>
            <pre id="modalMessage" style="color:red; font-size:0.9em;"></pre>
        </div>
    </div>

<script>
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const numInput = document.getElementById("numInput");
    const offButton = document.getElementById("offButton");
    const bleStateContainer = document.getElementById('bleState');

    const setupIcon = document.getElementById('setupIcon');
    const passwordModal = document.getElementById('passwordModal');
    const oldPasswordInput = document.getElementById('oldPassword');
    const newPasswordInput = document.getElementById('newPassword');
    const repeatPasswordInput = document.getElementById('repeatPassword');
    const sendPasswordButton = document.getElementById('sendPasswordButton');
    const cancelPasswordButton = document.getElementById('cancelPasswordButton');
    const modalMessage = document.getElementById('modalMessage');

    // BLE Device Specs
    const deviceName = 'BLE2FORD';
    const bleService = 'a1df2491-d1ac-43db-a181-fbfe50a90b16';
    const pOldPasswordCharacteristicUUID = 'a1df2492-d1ac-43db-a181-fbfe50a90b16';
    const pNewPasswordCharacteristicUUID = 'a1df2493-d1ac-43db-a181-fbfe50a90b16';
    const pRelaySecureCharacteristicUUID = 'a1df2494-d1ac-43db-a181-fbfe50a90b16';

    let bleServer;
    let pOldPasswordCharacteristicFound;
    let pNewPasswordCharacteristicFound;
    let pRelaySecureCharacteristicFound;

    // Filter ASCII and max 20 chars
    function asciiFilter(inputElement) {
        inputElement.value = inputElement.value
            .split('')
            .filter(ch => ch.charCodeAt(0) >= 0x21 && ch.charCodeAt(0) <= 0x7E)
            .slice(0, 20)
            .join('');
    }

    [numInput, oldPasswordInput, newPasswordInput, repeatPasswordInput].forEach(el => {
        el.addEventListener("input", () => {
            asciiFilter(el);
            checkNewPasswordMatch();
        });
    });

    function checkNewPasswordMatch() {
        const newVal = newPasswordInput.value;
        const repVal = repeatPasswordInput.value;
        if (newVal.length > 0 && newVal === repVal) {
            sendPasswordButton.disabled = false;
            modalMessage.textContent = "";
        } else {
            sendPasswordButton.disabled = true;
            if (repVal.length > 0 && newVal !== repVal) {
                modalMessage.style.color = "red";
                modalMessage.textContent = "New passwords do not match.";
            } else {
                modalMessage.textContent = "";
            }
        }
    }

    // Event listeners
    connectButton.addEventListener('click', () => { if (isWebBluetoothEnabled()) connectToDevice(); });
    disconnectButton.addEventListener('click', disconnectDevice);

    offButton.addEventListener('click', () => {
        const input = numInput.value.trim();
        if (!input) return;
        const data = new TextEncoder().encode(input);
        writeOnCharacteristic(pRelaySecureCharacteristicFound, data);
    });

    setupIcon.addEventListener('click', () => {
        modalMessage.textContent = "";
        oldPasswordInput.value = "";
        newPasswordInput.value = "";
        repeatPasswordInput.value = "";
        sendPasswordButton.disabled = true;
        passwordModal.style.display = "block";
    });

    cancelPasswordButton.addEventListener('click', () => {
        passwordModal.style.display = "none";
    });

    // Helper: read old password characteristic
    async function readOldPasswordStatus() {
        if (!pOldPasswordCharacteristicFound) return null;
        try {
            const value = await pOldPasswordCharacteristicFound.readValue();
            const decoded = new TextDecoder().decode(value);
            const hex = Array.from(value).map(b => b.toString(16).padStart(2, '0')).join(' ');
            modalMessage.textContent += `Read: decoded="${decoded}", hex=${hex}\n`;
            return decoded;
        } catch (err) {
            modalMessage.textContent += `Read failed: ${err}\n`;
            return null;
        }
    }

    // Send password
    sendPasswordButton.addEventListener('click', async () => {
        if (!pOldPasswordCharacteristicFound || !pNewPasswordCharacteristicFound) {
            modalMessage.style.color = "red";
            modalMessage.textContent = "BLE characteristic not found!";
            return;
        }

        const oldData = new TextEncoder().encode(oldPasswordInput.value);
        const newData = new TextEncoder().encode(newPasswordInput.value);

        try {
            // Write old password first
            await pOldPasswordCharacteristicFound.writeValue(oldData);
            modalMessage.textContent += `Old password sent: ${oldPasswordInput.value}\n`;

            // Then write new password
            await pNewPasswordCharacteristicFound.writeValue(newData);
            modalMessage.textContent += `New password sent: ${newPasswordInput.value}\n`;

            // Poll twice to skip the first read (which returns old password)
            setTimeout(async () => {
                modalMessage.textContent += "Skipping first read (old password)...\n";
                await readOldPasswordStatus(); // discard first
                modalMessage.textContent += "Reading actual status...\n";
                setTimeout(async () => {
                    const status = await readOldPasswordStatus(); // real status
                    if (status === "1") {
                        modalMessage.style.color = "green";
                        modalMessage.textContent += "Password update successful!\n";
                        setTimeout(() => passwordModal.style.display = "none", 1000);
                    } else if (status === "0") {
                        modalMessage.style.color = "red";
                        modalMessage.textContent += "Old password incorrect!\n";
                    } else {
                        modalMessage.style.color = "red";
                        modalMessage.textContent += "No response from device!\n";
                    }
                }, 200);
            }, 200);

        } catch (err) {
            modalMessage.style.color = "red";
            modalMessage.textContent += "Write failed: " + err + "\n";
        }
    });

    // Enhanced write function
    function writeOnCharacteristic(characteristicOrArray, data) {
        if (!characteristicOrArray) return;

        const characteristics = Array.isArray(characteristicOrArray)
            ? characteristicOrArray
            : [characteristicOrArray];

        let promise = Promise.resolve();
        characteristics.forEach(char => {
            promise = promise.then(() => char.writeValue(data)
                .then(() => console.log(`Value written to ${char.uuid}:`, data))
                .catch(err => console.error(`Write failed on ${char.uuid}:`, err))
            );
        });
        return promise;
    }

    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            bleStateContainer.innerHTML = "Web Bluetooth API not available!";
            bleStateContainer.style.color = "#d13a30";
            setButtonState(connectButton, false);
            setButtonState(disconnectButton, false);
            setButtonState(offButton, false);
            return false;
        }
        return true;
    }

    function connectToDevice() {
        setButtonState(connectButton, false);
        setButtonState(disconnectButton, false);
        setButtonState(offButton, false);
        bleStateContainer.innerHTML = 'Connecting to ' + deviceName;
        bleStateContainer.style.color = "#d13a30";

        navigator.bluetooth.requestDevice({
            filters: [{ name: deviceName }],
            optionalServices: [bleService]
        })
        .then(device => device.gatt.connect())
        .then(server => {
            bleServer = server;
            return bleServer.getPrimaryService(bleService);
        })
        .then(service => Promise.all([
            service.getCharacteristic(pOldPasswordCharacteristicUUID)
                .then(c => { pOldPasswordCharacteristicFound = c; }),
            service.getCharacteristic(pNewPasswordCharacteristicUUID)
                .then(c => { pNewPasswordCharacteristicFound = c; }),
            service.getCharacteristic(pRelaySecureCharacteristicUUID)
                .then(c => { pRelaySecureCharacteristicFound = c; })
        ]))
        .then(() => {
            bleStateContainer.innerHTML = "Connected to " + deviceName;
            bleStateContainer.style.color = "#00a000";
            setButtonState(connectButton, false);
            setButtonState(disconnectButton, true);
            setButtonState(offButton, true);
        })
        .catch(err => {
            console.error("Connection failed:", err);
            bleStateContainer.innerHTML = "Connection failed";
            bleStateContainer.style.color = "#d13a30";
            setButtonState(connectButton, true);
            setButtonState(disconnectButton, false);
            setButtonState(offButton, false);
        });
    }

    function disconnectDevice() {
        if (bleServer && bleServer.connected) {
            bleServer.disconnect();
        }
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";
        passwordModal.style.display = "none";
        setButtonState(connectButton, true);
        setButtonState(disconnectButton, false);
        setButtonState(offButton, false);
    }

    function setButtonState(button, enabled) {
        if (enabled) {
            button.disabled = false;
            if(button.classList.contains('connectButton')) button.style.backgroundColor = '#24af37';
            else if(button.classList.contains('disconnectButton')) button.style.backgroundColor = '#d13a30';
            else button.style.backgroundColor = '#5f6c6d';
            button.style.color = 'white';
            button.style.cursor = 'pointer';
        } else {
            button.disabled = true;
            button.style.backgroundColor = '#aaa';
            button.style.color = '#666';
            button.style.cursor = 'not-allowed';
        }
    }

    // Initialize buttons
    setButtonState(connectButton, true);
    setButtonState(disconnectButton, false);
    setButtonState(offButton, false);
</script>
</body>
</html>
