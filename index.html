<!DOCTYPE html>
<html>
<head>
    <title>BLE Door App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <p id="status"></p>
    <div class="topnav">
        <h1>BLE Door Web Application</h1>
        <p style="font-size:0.8em; color:#666;">Version 1.0.B</p>
    </div>

    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton"> Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="disconnectButton"> Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <p>
                    <label for="numInput">Befehl:</label>
                    <input id="numInput" type="text" placeholder="?">
                    <button id="offButton" class="offButton" >Senden</button>
                </p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <p>Last value received: <span id="valueContainer"></span></p>
                <p>Last sent: <span id="valueSent"></span></p>
                <p>Timestamp: <span id="timestamp"></span></p>
            </div>
        </div>
    </div>

<script>
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const numInput = document.getElementById("numInput");
    const offButton = document.getElementById("offButton");
    const status = document.getElementById("status");
    const retrievedValue = document.getElementById('valueContainer');
    const latestValueSent = document.getElementById('valueSent');
    const bleStateContainer = document.getElementById('bleState');
    const timestampContainer = document.getElementById('timestamp');

    // BLE Device Specs
    const deviceName ='BLE2FORD';
    const bleService = 'a1df2491-d1ac-43db-a181-fbfe50a90b16';
    const pRelaySecureCharacteristicUUID = 'a1df2493-d1ac-43db-a181-fbfe50a90b16';
    const pNonSecureCharacteristic = 'a1df2492-d1ac-43db-a181-fbfe50a90b16';

    let bleServer;
    let bleServiceFound;
    let pRelaySecureCharacteristicFound;
    let pNonSecureCharacteristicFound;

    // Event listeners
    connectButton.addEventListener('click', () => { if(isWebBluetoothEnabled()) connectToDevice(); });
    disconnectButton.addEventListener('click', disconnectDevice);

    offButton.addEventListener('click', () => {
        try {
            const input = numInput.value.trim();
            const data = stringToBytePairsHEX(input);
            console.log("Bytes to send:", data);
            latestValueSent.innerHTML = input;
            writeOnCharacteristic(data);
        } catch(e) {
            console.error(e.message);
        }
    });

    // Check BLE availability
    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            bleStateContainer.innerHTML = "Web Bluetooth API not available!";
            bleStateContainer.style.color = "#d13a30";
            return false;
        }
        return true;
    }

    // Connect to BLE Device
    function connectToDevice(){
        navigator.bluetooth.requestDevice({
            filters: [{name: deviceName}],
            optionalServices: [bleService]
        })
        .then(device => {
            bleStateContainer.innerHTML = 'Connecting to ' + device.name;
            bleStateContainer.style.color = "#d13a30";
            device.addEventListener('gattservicedisconnected', onDisconnected);
            return device.gatt.connect();
        })
        .then(server => {
            bleServer = server;
            return bleServer.getPrimaryService(bleService);
        })
        .then(service => {
            bleServiceFound = service;
            return Promise.all([
                service.getCharacteristic(pNonSecureCharacteristic)
                    .then(c => {
                        pNonSecureCharacteristicFound = c;
                        c.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
                        return c.startNotifications();
                    }),
                service.getCharacteristic(pRelaySecureCharacteristicUUID)
                    .then(c => {
                        pRelaySecureCharacteristicFound = c;
                        console.log("Secure characteristic found:", c.uuid);
                    })
            ]);
        })
        .then(() => {
            // ✅ All characteristics ready → update BLE state
            bleStateContainer.innerHTML = "Connected to " + deviceName;
            bleStateContainer.style.color = "#00a000"; // green
            offButton.disabled = false;
        })
        .catch(err => {
            console.error("Connection failed:", err);
            bleStateContainer.innerHTML = "Connection failed";
            bleStateContainer.style.color = "#d13a30";
        });
    }

    function onDisconnected(event){
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";
        offButton.disabled = true;
    }

    function handleCharacteristicChange(event){
        const newValue = new TextDecoder().decode(event.target.value);
        retrievedValue.innerHTML = newValue;
        timestampContainer.innerHTML = getDateTime();
    }

    function writeOnCharacteristic(data) {
        if (!pRelaySecureCharacteristicFound) {
            console.error("Secure characteristic not found!");
            return;
        }
        pRelaySecureCharacteristicFound.writeValue(data)
            .then(() => console.log("Value written:", data))
            .catch(err => console.error("Write failed:", err));
    }

    function disconnectDevice() {
        if (bleServer && bleServer.connected) {
            bleServer.disconnect();
            bleStateContainer.innerHTML = "Device disconnected";
            bleStateContainer.style.color = "#d13a30";
            offButton.disabled = true;
        }
    }

    function getDateTime() {
        const now = new Date();
        const pad = n => String(n).padStart(2,'0');
        return `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} at ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    function stringToBytePairsHEX(str) {
        str = str.replace(/\s+/g,''); // remove spaces
        if (str.length % 2 !== 0) throw new Error("Input must have even number of characters");
        const bytes = [];
        for (let i = 0; i < str.length; i += 2) {
            const pair = str.substr(i, 2);
            const byte = parseInt(pair, 16); // <-- HEX conversion
            if (isNaN(byte) || byte > 255) throw new Error(`Invalid byte "${pair}" at position ${i}`);
            bytes.push(byte);
        }
        return new Uint8Array(bytes);
    }
</script>
</body>
</html>
