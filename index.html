<!DOCTYPE html>
<html>
<head>
    <title>BLE Door App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <p id="status"></p>
    <div class="topnav">
        <h1>BLE Door Web Application</h1>
        <p id="version" style="text-align:right; color:#888;">Version 1.0.1</p>
    </div>
    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton"> Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="disconnectButton"> Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <p>
                    <label for="numInput">Befehl:</label>
                    <input id="numInput" type="text" placeholder="?                  ">
                    <button id="offButton" class="offButton">Senden</button>
                </p>
            </div>      
        </div>
    </div>

<script>
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const numInput = document.getElementById("numInput");
    const offButton = document.getElementById("offButton");
    
    const status = document.getElementById("status");
    const bleStateContainer = document.getElementById('bleState');

    // BLE Specs
    var deviceName ='BLE2FORD';
    var bleService = 'a1df2491-d1ac-43db-a181-fbfe50a90b16';
    var pRelaySecureCharacteristicUUID = 'a1df2493-d1ac-43db-a181-fbfe50a90b16';
    var pRelaySecureCharacteristicFound;
    var pNonSecureCharacteristic = 'a1df2492-d1ac-43db-a181-fbfe50a90b16';
    var pNonSecureCharacteristicFound;

    var bleServer;
    var bleServiceFound;

    // Connect Button
    connectButton.addEventListener('click', (event) => {
        if (isWebBluetoothEnabled()) {
            connectToDevice();
        }
    });

    // Disconnect Button
    disconnectButton.addEventListener('click', disconnectDevice);

    // Send Button
    offButton.addEventListener('click', () => {
        const input = numInput.value.trim();
        const data = stringToBytePairsDec(input);
        console.log("Bytes to send:", data);
        writeOnCharacteristic(data);
    });

    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            console.log('Web Bluetooth API is not available in this browser!');
            bleStateContainer.innerHTML = "Web Bluetooth API is not available in this browser/device!";
            return false;
        }
        console.log('Web Bluetooth API supported in this browser.');
        return true;
    }

    async function connectToDevice() {
        try {
            console.log('Initializing Bluetooth...');
            
            // Try remembered devices first
            let deviceList = await navigator.bluetooth.getDevices();
            let device = deviceList.find(d => d.name === deviceName);

            // If not found, show picker
            if (!device) {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: deviceName }],
                    optionalServices: [bleService]
                });
            }

            console.log('Device selected:', device.name);
            bleStateContainer.innerHTML = 'Connected to device ' + device.name;
            bleStateContainer.style.color = "#24af37";

            device.addEventListener('gattservicedisconnected', onDisconnected);

            // Connect GATT
            bleServer = await device.gatt.connect();
            console.log("Connected to GATT Server");

            bleServiceFound = await bleServer.getPrimaryService(bleService);
            console.log("Service discovered:", bleServiceFound.uuid);

            // Non-secure characteristic
            pNonSecureCharacteristicFound = await bleServiceFound.getCharacteristic(pNonSecureCharacteristic);
            pNonSecureCharacteristicFound.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
            await pNonSecureCharacteristicFound.startNotifications();

            // Secure characteristic
            pRelaySecureCharacteristicFound = await bleServiceFound.getCharacteristic(pRelaySecureCharacteristicUUID);
            console.log("RelaySecure characteristic found:", pRelaySecureCharacteristicFound.uuid);

            offButton.disabled = false; // enable send button

        } catch (error) {
            console.error('Connection error:', error);
        }
    }

    function onDisconnected(event){
        console.log('Device Disconnected:', event.target.device.name);
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";
    }

    function handleCharacteristicChange(event){
        const newValueReceived = new TextDecoder().decode(event.target.value);
        console.log("Characteristic value changed: ", newValueReceived);
    }

    function writeOnCharacteristic(data) {
        if (!pRelaySecureCharacteristicFound) {
            console.error("Secure characteristic not found!");
            return;
        }
        pRelaySecureCharacteristicFound.writeValue(data)
            .then(() => console.log("Value written to characteristic:", data))
            .catch(err => console.error("Write failed:", err));
    }

    function disconnectDevice() {
        console.log("Disconnect Device.");
        if (bleServer && bleServer.connected) {
            bleServer.disconnect();
            bleStateContainer.innerHTML = "Device Disconnected";
            bleStateContainer.style.color = "#d13a30";
            console.log("Device Disconnected");
        } else {
            console.warn("Bluetooth is not connected.");
            window.alert("Bluetooth is not connected.");
        }
    }

    function stringToBytePairsDec(str) {
        const bytes = [];
        for (let i = 0; i < str.length; i += 2) {
            const pair = str.substr(i, 2);
            const byte = parseInt(pair, 10);
            if (isNaN(byte) || byte > 255) {
                throw new Error(`Ungültiges Byte "${pair}" an Position ${i}`);
            }
            bytes.push(byte);
        }
        return new Uint8Array(bytes);
    }
</script>
</body>
</html>
