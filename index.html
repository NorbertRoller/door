<!DOCTYPE html>
<html>
<head>
    <title>BLE Door App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <p id="status"></p>
    <div class="topnav">
        <h1>BLE Door Web Application</h1>
    </div>
    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton"> Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="disconnectButton"> Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
            </div>
        </div>
        <div class="card-grid">
            <div class="card">
                <p>
                    <label for="numInput">Befehl:</label>
                    <input id="numInput" type="text" placeholder="?">
                    <button id="offButton" class="offButton" disabled>Senden</button>
                </p>
            </div>      
        </div>
    </div>

<script>
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const numInput = document.getElementById("numInput");
    const offButton = document.getElementById("offButton");
    const bleStateContainer = document.getElementById('bleState');
    const retrievedValue = document.getElementById('valueContainer');

    // BLE Specs
    const deviceName = 'BLE2FORD';
    const bleServiceUUID = 'a1df2491-d1ac-43db-a181-fbfe50a90b16';
    const pNonSecureCharacteristicUUID = 'a1df2492-d1ac-43db-a181-fbfe50a90b16';
    const pRelaySecureCharacteristicUUID = 'a1df2493-d1ac-43db-a181-fbfe50a90b16';

    // BLE Variables
    let bleServer;
    let bleService;
    let pNonSecureCharacteristic;
    let pRelaySecureCharacteristic;

    // Disable send button until characteristic is ready
    offButton.disabled = true;

    // Connect / Disconnect
    connectButton.addEventListener('click', () => {
        if (isWebBluetoothEnabled()) connectToDevice();
    });
    disconnectButton.addEventListener('click', disconnectDevice);

    // Send button click
	offButton.addEventListener('click', () => {
		const input = numInput.value.trim();
		const data = stringToBytePairsHex(input); // <-- Use HEX conversion
		console.log("Bytes to send:", data);
		writeOnCharacteristic(data);
	});

    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            console.error('Web Bluetooth API not available!');
            bleStateContainer.textContent = "Web Bluetooth API not available in this browser/device!";
            return false;
        }
        return true;
    }

    async function connectToDevice() {
        try {
            console.log('Requesting BLE device...');
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: deviceName }],
                optionalServices: [bleServiceUUID]
            });

            device.addEventListener('gattserverdisconnected', onDisconnected);
            bleStateContainer.textContent = 'Connecting to ' + device.name + '...';

            bleServer = await device.gatt.connect();
            console.log("Connected to GATT server");

            bleService = await bleServer.getPrimaryService(bleServiceUUID);

            // Get Non-Secure Characteristic for notifications
            pNonSecureCharacteristic = await bleService.getCharacteristic(pNonSecureCharacteristicUUID);
            await pNonSecureCharacteristic.startNotifications();
            pNonSecureCharacteristic.addEventListener('characteristicvaluechanged', handleCharacteristicChange);

            // Get Secure Relay Characteristic for writes
            pRelaySecureCharacteristic = await bleService.getCharacteristic(pRelaySecureCharacteristicUUID);
            console.log("RelaySecure characteristic found:", pRelaySecureCharacteristic.uuid);

            // Enable send button now
            offButton.disabled = false;
            bleStateContainer.textContent = 'Connected to ' + device.name;
            bleStateContainer.style.color = "#24af37";

        } catch (error) {
            console.error("BLE Connection failed:", error);
            bleStateContainer.textContent = "Error: " + error;
            bleStateContainer.style.color = "#d13a30";
        }
    }

    function onDisconnected(event) {
        console.warn("Device disconnected");
        bleStateContainer.textContent = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";
        offButton.disabled = true;
    }

    function handleCharacteristicChange(event) {
        const newValueReceived = new TextDecoder().decode(event.target.value);
        console.log("Notification received:", newValueReceived);
        if (retrievedValue) retrievedValue.textContent = newValueReceived;
    }

    async function writeOnCharacteristic(data) {
        if (!pRelaySecureCharacteristic) {
            console.error("Secure characteristic not ready!");
            return;
        }
        try {
            await pRelaySecureCharacteristic.writeValue(data);
            console.log("Data written:", data);
        } catch (err) {
            console.error("Write failed:", err);
        }
    }

    function disconnectDevice() {
        if (bleServer && bleServer.connected) {
            bleServer.disconnect();
            bleStateContainer.textContent = "Device Disconnected";
            bleStateContainer.style.color = "#d13a30";
            offButton.disabled = true;
        } else {
            console.warn("No device connected.");
            alert("Bluetooth is not connected.");
        }
    }

    function stringToBytePairsDec(str) {
        const bytes = [];
        for (let i = 0; i < str.length; i += 2) {
            const pair = str.substr(i, 2);
            const byte = parseInt(pair, 10);
            if (isNaN(byte) || byte > 255) throw new Error(`Invalid byte "${pair}" at position ${i}`);
            bytes.push(byte);
        }
        return new Uint8Array(bytes);
    }
	
	function stringToBytePairsHex(str) {
    if (str.length % 2 !== 0) {
        throw new Error("Input must have an even number of characters");
    }

    const bytes = [];
    for (let i = 0; i < str.length; i += 2) {
        const pair = str.substr(i, 2);
        const byte = parseInt(pair, 16); // <-- HEX base
        if (isNaN(byte) || byte > 255) {
            throw new Error(`Invalid byte "${pair}" at position ${i}`);
        }
        bytes.push(byte);
    }
    return new Uint8Array(bytes);
}

</script>
</body>
</html>
